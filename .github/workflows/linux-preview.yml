name: Linux preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m unittest discover -s tests -p test_control_session.py -v
      - run: python -m unittest discover -s tests -p test_linux_control.py -v
      - run: python -m build
      - run: |
          python -m venv /tmp/autobrightness-preview
          /tmp/autobrightness-preview/bin/pip install dist/*.whl
          /tmp/autobrightness-preview/bin/room-brightness-linux --list
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrightness-Linux-preview
          path: dist/*.whl
