name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[windows-build]"
      - run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrightness-Windows
          path: |
            dist/AutoBrightness-*-Setup.exe
            dist/AutoBrightness-*-portable.zip
