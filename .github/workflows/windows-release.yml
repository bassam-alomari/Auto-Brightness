name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*', '!v*-beta.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[windows-build,dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m unittest discover -s tests -q
      - run: python packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrightness-Windows
          path: |
            dist/AutoBrightness-*-Setup.exe
            dist/AutoBrightness-*-portable.zip
      - name: Publish tagged release with Windows downloads
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content pyproject.toml | Select-String '^version = "([0-9.]+)"$').Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match package version' }
          $setup = "dist/AutoBrightness-$version-Setup.exe"
          $portable = "dist/AutoBrightness-$version-portable.zip"
          foreach ($file in @($setup, $portable)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing asset: $file" }
          }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Inspect it before publishing again.' }
          gh release create $env:GITHUB_REF_NAME $setup $portable --verify-tag --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation or upload failed' }
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0 -or $assets -notcontains (Split-Path $setup -Leaf) -or $assets -notcontains (Split-Path $portable -Leaf)) { throw 'Draft assets incomplete' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
