[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-brightness"
version = "0.2.0"
description = "Local camera-based automatic brightness control for Windows laptops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials==6.10.2","opencv-python-headless==4.13.0.92", "numpy>=2,<3", "pystray==0.19.5", "Pillow>=10,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
room-brightness = "room_brightness.__main__:main"

[project.optional-dependencies]
windows-build = ["pyinstaller==6.19.0"]
dev = ["build>=1.2,<2", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
room_brightness = ["*.ps1", "*.svg", "*.json", "*.ico", "*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
